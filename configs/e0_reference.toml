extends = "base.toml"

[experiment]
name = "e0_reference"
model_name = "e0_reference"

[features]
use_velocity = false

[model]
hidden_dim = 32
num_layers = 1
dropout = 0.0

[training]
epochs = 10
batch_size = 64
lr = 0.001
weight_decay = 0.0005
grad_clip = 10.0
patience = 20
train_window_sampling = "random_window_per_sequence"
val_window_sampling = "random_window_per_sequence"
