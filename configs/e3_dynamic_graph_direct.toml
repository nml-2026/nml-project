extends = "e3_dynamic_graph_wide.toml"

[experiment]
name = "e3_dynamic_graph_direct"
model_name = "e3_dynamic_graph"

[model]
decoder_type = "direct"
use_relation_types = true
use_entity_embeddings = true
entity_embedding_dim = 16
separate_ball_head = true
direct_decoder_heads = 4

[training]
epochs = 30
batch_size = 192
lr = 0.0005
weight_decay = 0.0001
patience = 7
