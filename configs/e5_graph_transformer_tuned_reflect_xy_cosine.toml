extends = "e5_graph_transformer_tuned_reflect_xy.toml"

# Phase 5 (LR schedule): cosine-annealed LR on the Phase-1 x+y reflection best. The project
# had no scheduler (fixed lr=0.000349); the Phase-1 x+y run peaked at epoch 31/50 and used its
# full patience budget, hinting at convergence headroom. Cosine anneals the LR to lr_min over
# the full (extended) schedule. Budget raised to 80 epochs / patience 20 so the anneal can
# complete before early stopping. Default config keeps lr_scheduler="none" (off).
[experiment]
name = "e5_graph_transformer_tuned_reflect_xy_cosine"

[training]
lr_scheduler = "cosine"
epochs = 80
patience = 20
