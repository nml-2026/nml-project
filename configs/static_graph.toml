extends = "base.toml"

[experiment]
name = "static_graph"

[model]
family = "static_graph"

[model.common]
message_dim = 128
hidden_dim = 128
dropout = 0.1
num_layers = 2

[model.graph]
dynamic_edges = false
use_semantic_flags = true

[training]
epochs = 80
batch_size = 128
patience = 80

[evaluation]
tta_group = "none"
