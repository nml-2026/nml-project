extends = "base.toml"

[experiment]
name = "e1_social_ssm"
model_name = "e1_social_ssm"

[model]
hidden_dim = 160
dropout = 0.1
use_semantic_flags = true
use_entity_embeddings = true
entity_embedding_dim = 16
temporal_ssm_layers = 2
social_ssm_layers = 1
decoder_ssm_layers = 2
ssm_conv_kernel = 3
separate_ball_head = true

[training]
epochs = 30
batch_size = 192
lr = 0.0005
patience = 7
