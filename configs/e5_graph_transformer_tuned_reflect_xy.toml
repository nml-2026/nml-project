extends = "e5_graph_transformer_tuned.toml"

# Phase 1 (C2) full dihedral court-reflection augmentation on the tuned best model:
# independent y -> -y (left/right mirror) and x -> -x (attack-direction reversal), each
# p=0.5, giving {I, Rx, Ry, RxRy}. Both are valid label-preserving plays because the
# dataset spans the full court with both attack directions in ~50/50 balance.
# Compare against e5_graph_transformer_tuned_reflect (y-only) and ..._tuned (reflect off).

[experiment]
name = "e5_graph_transformer_tuned_reflect_xy"
model_name = "e5_graph_transformer"

[features]
reflect_prob = 0.5
reflect_x_prob = 0.5
