extends = "mart.toml"

[experiment]
name = "tune_mart"

[features.augmentation]
context_noise_std_ft = 0.0
context_frame_dropout_prob = 0.0
context_frame_dropout_mode = "previous"

[training]
epochs = 100
patience = 100
grad_clip = 1.0
lr_scheduler = "multistep"
lr_milestones = [60, 85]
lr_gamma = 0.5
max_train_batches = 0
max_val_batches = 0
num_workers = -1

[evaluation]
num_examples = 1
tta_group = "none"
