[experiment]
name = "base"
seed = 0
data_dir = "data"
output_root = "runs"
split_path = "artifacts/splits/default_split.json"
device = "auto"
context_size = 8
horizon_size = 12
num_entities = 11
checkpoint_metric = "ade"

[runtime]
optimizer_backend = "adamw_fused"
optimization_backend = "compile"
mixed_precision = true

[features]
use_velocity = true

[features.reflection]
mode = "random"
y_prob = 0.5
x_prob = 0.5

[features.augmentation]
# Shuffles player indices (ball fixed) during training.
agent_permutation_prob = 0.5
context_noise_std_ft = 0.0
context_frame_dropout_prob = 0.0
context_frame_dropout_mode = "previous"

[training]
epochs = 20
batch_size = 128
lr = 0.001
weight_decay = 0.0001
lr_scheduler = "none"
lr_milestones = []
lr_gamma = 0.1
grad_clip = 1.0
# -1 = auto from CPU budget (see runtime_env.py); 0 = disable workers (tests)
num_workers = -1
patience = 5
log_every = 50
teacher_forcing_prob = 0.0
scheduled_sampling_final_prob = 0.0
ema_decay = 0.0
swa_start_pct = 0.0
lr_warmup_epochs = 0
lr_min = 0.0
max_train_batches = 0
max_val_batches = 0
train_window_sampling = "all_windows"
val_window_sampling = "all_windows"

[loss]
lambda_smooth = 0.0
lambda_boundary = 0.0
lambda_ball = 0.0
court_x_half = 47.0
court_y_half = 25.0
boundary_margin = 2.0
ball_max_dist = 8.0
sample_loss_type = "hard_min_ade"
sample_loss_space = "normalized"
raw_loss_scale_ft = 0.0
softmin_temperature = 1.0
point_loss_weight = 0.0
point_loss_start_epoch = 1
point_loss_warmup_epochs = 0
mixture_nll_weight = 0.0
mixture_nll_start_epoch = 1
mixture_nll_warmup_epochs = 0
mixture_nll_detach_means = false

[evaluation]
num_examples = 3
tta_group = "none"
