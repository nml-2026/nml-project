extends = "base.toml"

[experiment]
name = "dynamic_graph_autoregressive"

[model]
family = "dynamic_graph_autoregressive"

[model.common]
message_dim = 128
hidden_dim = 128
dropout = 0.1
num_layers = 2

[model.graph]
dynamic_edges = true
use_semantic_flags = true
k_neighbors = 3
decoder_type = "autoregressive"

[training]
epochs = 80
batch_size = 128
patience = 80

[evaluation]
tta_group = "none"
