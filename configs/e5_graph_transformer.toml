extends = "base.toml"

[experiment]
name = "e5_graph_transformer"
model_name = "e5_graph_transformer"

[model]
hidden_dim = 192
dropout = 0.1
k_neighbors = 5
use_semantic_flags = true
dynamic_edges = true
use_entity_embeddings = true
entity_embedding_dim = 16
separate_ball_head = true
transformer_heads = 4
spatial_layers = 2
temporal_layers = 2
decoder_layers = 2
transformer_ffn_multiplier = 2.0
graph_ablation_mode = "normal"

[training]
epochs = 35
batch_size = 192
lr = 0.0005
weight_decay = 0.0001
patience = 8
