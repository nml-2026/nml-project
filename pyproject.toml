[build-system]
requires = ["uv_build>=0.11.18,<0.12"]
build-backend = "uv_build"

[project]
name = "nba-trajectory-forecasting"
version = "0.1.0"
description = "Script-first pipeline for the EPFL Network Machine Learning NBA trajectory project."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.10",
  "numpy>=1.26,<2",
  "optuna>=3.6",
  "pandas>=2.2",
  "ray[tune]>=2.52.1",
  "tomli>=2.0; python_version < '3.11'",
  "tqdm>=4.62",
]

[project.optional-dependencies]
cpu = [
  "torch>=2.0",
]

# Non-obvious runtime dependency:
# Triton 3.1.x may import setuptools during torch.compile / Inductor checks.
# Without this, CUDA torch.compile can fail with:
#   RuntimeError: Cannot find a working triton installation
cu121 = [
  "torch>=2.0",
  "setuptools>=70",
]
cu124 = [
  "torch>=2.0",
  "setuptools>=70",
]
cu128 = [
  "torch>=2.0",
  "setuptools>=70",
]
dev = [
  "pre-commit>=4.0",
  "pytest>=8.0",
  "ruff>=0.15.11",
]

[project.scripts]
nba-forecast = "nba_forecasting.cli:main"
nml = "nba_forecasting.cli:main"

[tool.ruff]
line-length = 140
target-version = "py310"
exclude = [
  "local",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["nba_forecasting"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = "nba_forecasting"
module-root = "src"

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu121" },
  ],
  [
    { extra = "cpu" },
    { extra = "cu124" },
  ],
  [
    { extra = "cpu" },
    { extra = "cu128" },
  ],
  [
    { extra = "cu121" },
    { extra = "cu124" },
  ],
  [
    { extra = "cu121" },
    { extra = "cu128" },
  ],
  [
    { extra = "cu124" },
    { extra = "cu128" },
  ],
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu121", extra = "cu121" },
  { index = "pytorch-cu124", extra = "cu124" },
  { index = "pytorch-cu128", extra = "cu128" },
]
